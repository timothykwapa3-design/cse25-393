
<!-- ==================== CART PAGE ==================== -->
<div class="page" id="page-cart">
  <div class="cart-layout" id="cart-layout">
    <div class="cart-items-col">
      <h2 class="cart-col-header">YOUR CART</h2>
      <div id="cart-items-list"></div>
    </div>
    <div class="cart-summary-col">
      <div class="summary-title">ORDER SUMMARY</div>
      <div class="summary-line"><span>Subtotal</span><span id="s-subtotal">P0</span></div>
      <div class="summary-line"><span>Shipping</span><span id="s-shipping">Calculated at checkout</span></div>
      <div class="summary-line"><span>VAT (14%)</span><span id="s-vat">P0</span></div>
      <div class="summary-total"><span>Total</span><span class="amt" id="s-total">P0</span></div>
      <button class="checkout-btn">Proceed to Checkout</button>
      <button class="continue-btn" onclick="showPage('home')">Continue Shopping</button>
    </div>
  </div>
</div>
